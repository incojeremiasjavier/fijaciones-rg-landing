<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada · Marco Gaete</title>
<meta name="robots" content="noindex,follow" />
<meta name="theme-color" content="#0E0F12" />
<link rel="icon" href="/marca/favicon-32.png" type="image/png" />
<link rel="apple-touch-icon" href="/marca/favicon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#D13B2B;--blueprint:#8A93A1;--muted:#9AA1AC;
    --font-display:"Archivo","Segoe UI",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace}
  body{font-family:var(--font-display);background:#0E0F12;color:#F2F4F6;min-height:100vh;
    display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden;position:relative}
  .grid{position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(128,152,178,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(128,152,178,.06) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(120% 90% at 50% 30%,#000 30%,transparent 80%)}
  .box{position:relative;z-index:1;max-width:520px}
  .code{font-family:var(--font-mono);font-size:clamp(72px,18vw,140px);font-weight:500;line-height:1;color:var(--gold);letter-spacing:-.02em}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--blueprint);margin-bottom:8px}
  h1{font-weight:800;font-size:clamp(24px,4vw,34px);letter-spacing:-.02em;margin:18px 0 10px}
  p{color:var(--muted);font-size:16px;max-width:42ch;margin:0 auto 28px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:13px 22px;border-radius:4px;border:1px solid transparent;transition:transform .18s,background .2s,border-color .2s,color .2s;cursor:pointer}
  .btn--primary{background:var(--gold);color:#14140E}
  .btn--primary:hover{background:#EC5A4C;transform:translateY(-2px)}
  .btn--ghost{border-color:rgba(255,255,255,.16);color:#F2F4F6}
  .btn--ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
  a{text-decoration:none;color:inherit}
</style>
<style id="fixes-qa">
/* accesibilidad (auditoría WCAG AA) */
.pd-info .ey,.cta-band__k,h3 .n,#porque p a{color:#EC5A4C}
.fbtn[aria-pressed="true"],.dock-item--cta,.dock-item:hover,.msg--user,.msg--user a,.vplay,.chat-fab,.rcard__av,.chat-head__av{color:#fff}

:focus-visible{outline:2px solid #EC5A4C;outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #EC5A4C;outline-offset:1px}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:#EC5A4C;color:#fff;padding:10px 16px;border-radius:6px;font-weight:700}
.skip:focus{left:16px;top:16px}
html{scroll-padding-bottom:110px}
.eyebrow,.ey,.brand__name b,.packcard__code,.packcard__cta,.plan__k,.marquee__item b,.topbar__r a{color:#EC5A4C}
.band--paper .eyebrow,.band--paper .pstep__n,.sec--paper .ey,.mv__k,.tip__k,.pstep__n{color:#B8301F}
.btn--primary,.plan__badge,.fbtn.active{color:#fff}
.cat-footer,.cat-footer .wrap,.cat-footer a,#logosClientes i{color:#868d98}
#porque p a{text-decoration:underline}
.nav__item:focus-within .dropdown{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.dock-item:focus-visible .dock-item__tip{opacity:1;visibility:visible}
.rev-dot{width:24px!important;height:24px!important;background:none!important;position:relative;border-radius:50%}
.rev-dot::after{content:"";position:absolute;left:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--border-str,#888);transition:all .2s}
.rev-dot.active::after{background:#D13B2B;left:3px;width:18px;border-radius:4px}
.rev-pause{background:none;border:1px solid currentColor;border-radius:100px;padding:6px 12px;font:600 12px/1 var(--font-mono,monospace);cursor:pointer;color:inherit;margin-left:8px}
.req{color:#B8301F}

.brand__mark{overflow:hidden}
.brand__mark img{width:100%;height:100%;object-fit:contain;display:block}
.form-ok[hidden]{display:none!important}
section[id]{scroll-margin-top:96px}
.pd-media{aspect-ratio:16/10}
@media (max-width:560px){
  .back-link{font-size:0;gap:0}
  .back-link svg{width:20px;height:20px}
  .brand__name{white-space:nowrap}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr}
  .hero-stats .hs{margin-right:0;padding:14px 12px 8px 0;border-right:none;border-bottom:1px solid var(--steel)}
}
</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<main id="contenido">
  <div class="grid"></div>
  <div class="box">
    <div class="eyebrow">Error 404</div>
    <div class="code">404</div>
    <h1>Esta pieza no está en góndola</h1>
    <p>La página que buscas no existe o cambió de lugar. Volvamos a terreno conocido.</p>
    <div class="btns">
      <a class="btn btn--primary" href="/">Volver al inicio</a>
      <a class="btn btn--ghost" href="https://wa.me/56931278297?text=Hola%2C%20quiero%20cotizar" data-wa="cotizar" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
    </div>
  </div>
<!-- CTA WIRING (WhatsApp + correo) -->
</main>

<script>
(function(){
  "use strict";
  var WA = "https://wa.me/56931278297";
  var MSG = {
    cotizar:  "¡Hola Marco Gaete! 👋 Encontré su sitio web y quiero cotizar. ¿Me ayudan con precio, stock y plazo para retiro? 🙌",
    despacho: "¡Hola Marco Gaete! 👋 Quiero coordinar el retiro de mi pedido en el taller de Independencia. Si es un pedido de volumen, ¿se puede despachar? Les paso el detalle. 🔧",
    lote:     "¡Hola Marco Gaete! 👋 Necesito comprar por volumen / lote y me interesa precio especial. Les detallo producto, medida y cantidad. 📦",
    servicio: "¡Hola Marco Gaete! 👋 Necesito corte a medida o hilo a pedido. Les mando las medidas y el material para cotizar. 🛠️",
    producto: "¡Hola Marco Gaete! 👋 Vi un producto en su web y quiero cotizarlo. ¿Me confirman precio, stock y cuándo lo puedo retirar? 🙌"
  };
  document.querySelectorAll("[data-wa]").forEach(function(a){
    var k = a.getAttribute("data-wa") || "cotizar";
    a.href = WA + "?text=" + encodeURIComponent(MSG[k] || MSG.cotizar);
    a.target = "_blank"; a.rel = "noopener";
  });
  function gmail(to, su, body){ return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(to) + "&su=" + encodeURIComponent(su) + "&body=" + encodeURIComponent(body); }
  var ESU = "Cotización web — Marco Gaete";
  var EBODY = "Hola Marco Gaete, quiero cotizar:\n\n- Producto: \n- Medida / grado: \n- Cantidad: \n- Retiro en taller o despacho (solo volumen): \n\n¡Gracias!";
  document.querySelectorAll("[data-mail]").forEach(function(a){
    var to = a.getAttribute("data-mail") || "ventas.mgaete@gmail.com";
    a.href = gmail(to, ESU, EBODY); a.target = "_blank"; a.rel = "noopener";
  });
})();
</script>

</body>
</html>
